<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI·SW 탐험대</title>
  <style>
    :root {
      --ink: #24324a;
      --muted: #64748b;
      --blue: #4778e8;
      --blue-soft: #edf3ff;
      --green: #18845b;
      --green-soft: #e9f8f0;
      --red: #c34c4c;
      --red-soft: #fff0ef;
      --paper: #ffffff;
      --bg: #f3f6fc;
      --line: #e3e9f3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 14px 40px;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: var(--ink); background: var(--bg);
    }
    .app { max-width: 760px; margin: 0 auto; }
    header { text-align: center; margin: 8px 0 22px; }
    .mascot { font-size: 48px; }
    h1 { margin: 6px 0; font-size: clamp(27px, 5vw, 38px); }
    .subtitle { color: var(--muted); font-size: 16px; }
    .panel {
      background: var(--paper); border: 1px solid var(--line);
      border-radius: 22px; padding: 22px; box-shadow: 0 8px 26px #30466b0d;
    }
    .topline { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; }
    .pill { background:var(--blue-soft); color:#315fc7; padding:8px 13px; border-radius:999px; font-weight:700; font-size:14px; }
    .progress { height:10px; background:#edf0f6; border-radius:99px; overflow:hidden; margin:16px 0 22px; }
    .bar { height:100%; width:0%; background:linear-gradient(90deg,#5b8cf2,#7c6ce8); transition:width .25s; }
    .question { font-size:clamp(21px,4vw,27px); line-height:1.5; font-weight:800; margin:8px 0 20px; }
    .answers { display:grid; gap:11px; }
    .answer {
      width:100%; text-align:left; border:2px solid var(--line); background:white;
      color:var(--ink); border-radius:16px; padding:15px 16px; font-size:18px;
      cursor:pointer; transition:.15s; line-height:1.35;
    }
    .answer:hover:not(:disabled) { border-color:#91acef; background:#f8faff; }
    .answer:focus-visible, button:focus-visible { outline:3px solid #f4b942; outline-offset:3px; }
    .answer:disabled { cursor:default; opacity:1; }
    .answer.correct { border-color:#69bd91; background:var(--green-soft); }
    .answer.wrong { border-color:#e39a96; background:var(--red-soft); }
    .feedback { display:none; margin-top:17px; padding:16px; border-radius:15px; line-height:1.55; font-size:16px; }
    .feedback.show { display:block; }
    .feedback.good { background:var(--green-soft); color:#176444; }
    .feedback.try { background:var(--red-soft); color:#963c3c; }
    .actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
    button.primary {
      border:0; border-radius:14px; background:var(--blue); color:white;
      padding:13px 22px; font-size:17px; font-weight:800; cursor:pointer;
    }
    button.primary:disabled { background:#b8c4d9; cursor:not-allowed; }
    .start, .result { text-align:center; }
    .start p, .result p { font-size:18px; line-height:1.7; color:var(--muted); }
    .big-emoji { font-size:64px; margin:8px 0; }
    .score { font-size:42px; font-weight:900; color:var(--blue); margin:12px 0; }
    .hidden { display:none; }
    .small-note { color:var(--muted); font-size:13px; text-align:center; margin-top:15px; }
    @media (max-width:480px) {
      body { padding:15px 10px 28px; }
      .panel { padding:17px; border-radius:18px; }
      .answer { font-size:17px; padding:14px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="mascot" aria-hidden="true">🤖✨</div>
      <h1>AI·SW 탐험대</h1>
      <div class="subtitle">생각하고, 고르고, 똑똑하게 도전해요!</div>
    </header>

    <section id="start" class="panel start">
      <div class="big-emoji">🚀</div>
      <h2>탐험을 시작해 볼까요?</h2>
      <p>AI와 컴퓨터에 관한 문제 5개를 풀어요.<br>답을 고르면 바로 설명을 확인할 수 있어요.</p>
      <button class="primary" onclick="startQuiz()">탐험 시작!</button>
    </section>

    <section id="quiz" class="panel hidden" aria-live="polite">
      <div class="topline">
        <span id="step" class="pill">문제 1 / 5</span>
        <span id="scoreLabel" class="pill">⭐ 0점</span>
      </div>
      <div class="progress"><div id="bar" class="bar"></div></div>
      <div id="question" class="question"></div>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback" role="status"></div>
      <div class="actions">
        <button id="next" class="primary" onclick="nextQuestion()" disabled>다음 문제</button>
      </div>
    </section>

    <section id="result" class="panel result hidden">
      <div class="big-emoji" id="resultEmoji">🏆</div>
      <h2>탐험 완료!</h2>
      <div id="finalScore" class="score">5문제 중 0문제 정답</div>
      <p id="resultMessage"></p>
      <button class="primary" onclick="restartQuiz()">다시 도전하기</button>
    </section>
    <div class="small-note">내 생각으로 먼저 골라 보고, 설명을 읽으며 배워요.</div>
  </main>

<script>
const questions = [
  {
    q: "AI가 동물 사진을 보고 고양이인지 강아지인지 알아보려면 무엇이 필요할까요?",
    choices: ["동물 사진 데이터", "큰 스피커", "긴 연필"],
    answer: 0,
    why: "맞아요! AI는 고양이와 강아지 사진 같은 데이터를 살펴보며 특징을 배울 수 있어요."
  },
  {
    q: "컴퓨터에게 일을 시킬 때, 해야 할 일을 차례대로 알려 주는 방법은 무엇일까요?",
    choices: ["순서", "색칠", "박수"],
    answer: 0,
    why: "컴퓨터가 일을 잘하려면 해야 할 일을 알맞은 순서로 알려 주어야 해요."
  },
  {
    q: "비가 오면 우산을 챙기도록 정했어요. 여기에서 '비가 오면'은 무엇일까요?",
    choices: ["조건", "장식", "점수"],
    answer: 0,
    why: "정답이에요! 어떤 상황에서 일을 할지 정하는 것을 조건이라고 해요."
  },
  {
    q: "AI가 알려 준 답이 항상 맞을까요?",
    choices: ["항상 맞아요", "틀릴 수도 있으니 확인해요", "아무렇게나 믿어요"],
    answer: 1,
    why: "아주 중요해요! AI도 틀릴 수 있어요. AI의 답을 사람이 다시 확인해야 해요."
  },
  {
    q: "컴퓨터 프로그램을 만들 때, 문제가 생기면 어떻게 하는 것이 좋을까요?",
    choices: ["그만두기", "어디에서 잘못되었는지 찾아 고치기", "컴퓨터 끄기만 하기"],
    answer: 1,
    why: "맞아요! 프로그램이 생각대로 움직이지 않으면 차근차근 살펴보고 고치는 과정을 거쳐요."
  }
];

let current = 0;
let score = 0;
let answered = false;

function startQuiz() {
  current = 0; score = 0;
  document.getElementById("start").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  showQuestion();
}
function showQuestion() {
  answered = false;
  const item = questions[current];
  document.getElementById("step").textContent = `문제 ${current + 1} / ${questions.length}`;
  document.getElementById("scoreLabel").textContent = `⭐ ${score}점`;
  document.getElementById("bar").style.width = `${(current / questions.length) * 100}%`;
  document.getElementById("question").textContent = item.q;
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").textContent = "";
  document.getElementById("next").disabled = true;
  document.getElementById("next").textContent = current === questions.length - 1 ? "결과 보기" : "다음 문제";
  const area = document.getElementById("answers");
  area.innerHTML = "";
  item.choices.forEach((choice, index) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = `${["①", "②", "③"][index]}  ${choice}`;
    button.onclick = () => chooseAnswer(index);
    area.appendChild(button);
  });
}
function chooseAnswer(index) {
  if (answered) return;
  answered = true;
  const item = questions[current];
  const buttons = [...document.querySelectorAll(".answer")];
  buttons.forEach((button, i) => {
    button.disabled = true;
    if (i === item.answer) button.classList.add("correct");
    if (i === index && i !== item.answer) button.classList.add("wrong");
  });
  const feedback = document.getElementById("feedback");
  if (index === item.answer) {
    score++;
    feedback.className = "feedback show good";
    feedback.textContent = `🎉 정답이에요! ${item.why}`;
  } else {
    feedback.className = "feedback show try";
    feedback.textContent = `괜찮아요! 정답은 ${item.choices[item.answer]}이에요. ${item.why}`;
  }
  document.getElementById("scoreLabel").textContent = `⭐ ${score}점`;
  document.getElementById("next").disabled = false;
}
function nextQuestion() {
  if (!answered) return;
  current++;
  if (current < questions.length) showQuestion();
  else showResult();
}
function showResult() {
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("bar").style.width = "100%";
  document.getElementById("finalScore").textContent = `${questions.length}문제 중 ${score}문제 정답`;
  document.getElementById("resultEmoji").textContent = score === 5 ? "🏆" : score >= 3 ? "🌟" : "💪";
  document.getElementById("resultMessage").textContent =
    score === 5 ? "완벽해요! AI·SW 탐험 실력이 정말 멋져요!" :
    score >= 3 ? "잘했어요! 다시 도전하면 더 잘할 수 있어요." :
    "도전한 것만으로도 멋져요! 다시 풀며 하나씩 알아가요.";
}
function restartQuiz() { startQuiz(); }
</script>
</body>
</html>
